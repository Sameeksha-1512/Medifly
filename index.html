<!DOCTYPE html>
<html>

<head>
    <title>MEDIFLY</title>
    <link rel="stylesheet" href="gradient.css">
    <link
     rel="stylesheet"
     href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     />
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
<h1>MEDIFLY</h1>
<p> Emergency drone medical supply delivery system </p>
    <!-- 🔴 LOGIN SCREEN (PLACE HERE - BEFORE CONTAINER) -->
<div id="loginScreen">

    <h2>Enter Details</h2>

    <input id="name" type="text" placeholder="Your Name" required>
    <input id="phone" type="text" placeholder="Your Phone Number" required>
    <input id="location" type="text" placeholder="Enter Location" required>

    <button onclick="startApp()">Continue</button>

</div>
<div class="container">

        <h1>Emergency Medical Drone Service</h1>

        <p>
            Request immediate medical supplies delivered by emergency drones.
        </p>
        <div id="map"></div>

        <form id="droneForm">
            
            <select id="supply">

                <option>First Aid Kit</option>
                <option>Blood</option>
                <option>Medicine</option>
                <option>Tourniquet</option>
                <option>CPR Breathing Barrier</option>
                <option>BVM</option>

            </select>

            <button type="button" onclick="sendSOS()">
                SOS
            </button>

            <button type="submit">
                Request Drone
            </button>

        </form>
       <h2 id="dashboard"> System Ready</h2>
    
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
